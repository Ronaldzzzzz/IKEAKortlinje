<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Helvetica,Arial,sans-serif" font-size="14">
  <!-- 無文字示意圖：說明與圖例寫在 ikea_clock_modding_guide.md，方便多語系共用 -->
  <rect width="860" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d23"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a8a3a"/></marker>
    <!-- 機身剖面：上方為背蓋側，下方為正面 LED；中間為內部支架 -->
    <g id="body">
      <path d="M60,62 L60,260 L340,260 L340,62" fill="none" stroke="#333" stroke-width="6" stroke-linejoin="round"/>
      <line x1="63" y1="160" x2="337" y2="160" stroke="#333" stroke-width="4"/>
      <rect x="70" y="240" width="260" height="12" fill="#f0c040"/>
      <!-- 左側電池彈簧片 -->
      <path d="M68,92 l10,-6 l-10,-6 l10,-6" fill="none" stroke="#888" stroke-width="2"/>
      <!-- 支架上的反向倒勾（紅） -->
      <path d="M250,160 L250,84 L276,116 L256,116 L256,160 Z" fill="#d23"/>
    </g>
    <!-- 背蓋（藍）＋ U 形扣環 -->
    <g id="cover">
      <rect x="64" y="68" width="272" height="8" fill="#4a7bd0"/>
      <path d="M259,76 L259,124 L281,124 L281,76" fill="none" stroke="#4a7bd0" stroke-width="5"/>
    </g>
    <!-- 編號標籤 -->
    <g id="tags" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">
      <line x1="300" y1="100" x2="282" y2="104" stroke="#555"/><circle cx="310" cy="100" r="10" fill="#555"/><text x="310" y="104">1</text>
      <line x1="226" y1="132" x2="249" y2="132" stroke="#555"/><circle cx="216" cy="132" r="10" fill="#555"/><text x="216" y="136">2</text>
      <line x1="140" y1="180" x2="140" y2="162" stroke="#555"/><circle cx="140" cy="190" r="10" fill="#555"/><text x="140" y="194">3</text>
      <line x1="100" y1="80" x2="80" y2="80" stroke="#555"/><circle cx="110" cy="80" r="10" fill="#555"/><text x="110" y="84">4</text>
      <line x1="200" y1="228" x2="200" y2="240" stroke="#555"/><circle cx="200" cy="218" r="10" fill="#555"/><text x="200" y="222">5</text>
    </g>
  </defs>

  <!-- A：錯誤 -->
  <g transform="translate(0,20)">
    <circle cx="30" cy="20" r="16" fill="#d23"/>
    <path d="M22,12 L38,28 M38,12 L22,28" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <use href="#body"/>
    <g transform="rotate(5 300 72)"><use href="#cover"/></g>
    <use href="#tags"/>
    <path d="M84,44 L84,8" stroke="#d23" stroke-width="4" marker-end="url(#ar)"/>
    <circle cx="300" cy="72" r="5" fill="#d23"/>
  </g>

  <!-- B：正確 -->
  <g transform="translate(430,20)">
    <circle cx="30" cy="20" r="16" fill="#1a8a3a"/>
    <path d="M21,20 L28,27 L40,13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#body"/>
    <use href="#cover"/>
    <use href="#tags"/>
    <path d="M84,22 L84,62" stroke="#1a8a3a" stroke-width="4" marker-end="url(#ag)"/>
    <circle cx="104" cy="30" r="11" fill="#1a8a3a"/><text x="104" y="35" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
    <!-- 一字起子插入右側接縫 -->
    <rect x="334" y="70" width="50" height="6" fill="#999" transform="rotate(-30 334 73)"/>
    <rect x="380" y="66" width="30" height="14" rx="3" fill="#e08a1e" transform="rotate(-30 334 73)"/>
    <path d="M300,62 L300,22" stroke="#1a8a3a" stroke-width="4" marker-end="url(#ag)"/>
    <circle cx="278" cy="30" r="11" fill="#1a8a3a"/><text x="278" y="35" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
  </g>
</svg>

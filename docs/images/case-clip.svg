<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15">
  <rect width="860" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d23"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a8a3a"/></marker>
    <!-- 機身剖面：上方為背蓋側，下方為正面 LED；中間為內部支架 -->
    <g id="body">
      <path d="M60,62 L60,260 L340,260 L340,62" fill="none" stroke="#333" stroke-width="6" stroke-linejoin="round"/>
      <line x1="63" y1="160" x2="337" y2="160" stroke="#333" stroke-width="4"/>
      <text x="110" y="180" font-size="12" fill="#666">內部支架</text>
      <rect x="70" y="240" width="260" height="12" fill="#f0c040"/>
      <text x="200" y="282" text-anchor="middle" font-size="12" fill="#666">正面 LED</text>
      <!-- 左側電池彈簧片 -->
      <path d="M68,92 l10,-6 l-10,-6 l10,-6" fill="none" stroke="#888" stroke-width="2"/>
      <!-- 支架上的反向倒勾（紅）：立柱 + 勾頭 -->
      <path d="M250,160 L250,84 L276,116 L256,116 L256,160 Z" fill="#d23"/>
    </g>
    <!-- 背蓋（藍）＋ 往下伸出的 U 形扣環，套住倒勾的勾頭 -->
    <g id="cover">
      <rect x="64" y="68" width="272" height="8" fill="#4a7bd0"/>
      <path d="M259,76 L259,124 L281,124 L281,76" fill="none" stroke="#4a7bd0" stroke-width="5"/>
    </g>
  </defs>

  <!-- ✗ 錯誤 -->
  <text x="200" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#d23">✗ 先把左側往外拉</text>
  <g transform="translate(0,40)">
  <use href="#body"/>
  <g transform="rotate(5 300 72)"><use href="#cover"/></g>
  <path d="M84,44 L84,8" stroke="#d23" stroke-width="4" marker-end="url(#ar)"/>
  <text x="94" y="20" fill="#d23" font-size="14">左側拉開</text>
  <circle cx="300" cy="72" r="5" fill="#d23"/>
  <text x="300" y="54" fill="#d23" font-size="14" text-anchor="middle">支點</text>
  </g>
  <text x="200" y="352" text-anchor="middle" fill="#333">背蓋繞著卡勾附近轉動，扣環被壓向倒勾</text>
  <text x="200" y="374" text-anchor="middle" fill="#333">→ 卡得更緊，越拉越拔不出來</text>

  <!-- ✓ 正確 -->
  <g transform="translate(430,0)">
    <text x="200" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a8a3a">✓ 左側壓回原位，撬右側</text>
    <g transform="translate(0,40)">
    <use href="#body"/>
    <use href="#cover"/>
    <path d="M84,26 L84,62" stroke="#1a8a3a" stroke-width="4" marker-end="url(#ag)"/>
    <text x="94" y="36" fill="#1a8a3a" font-size="14">① 左側完全壓回</text>
    <!-- 一字起子插入右側接縫 -->
    <rect x="334" y="70" width="50" height="6" fill="#999" transform="rotate(-30 334 73)"/>
    <rect x="380" y="66" width="30" height="14" rx="3" fill="#e08a1e" transform="rotate(-30 334 73)"/>
    <path d="M300,62 L300,26" stroke="#1a8a3a" stroke-width="4" marker-end="url(#ag)"/>
    <text x="290" y="36" fill="#1a8a3a" font-size="14" text-anchor="end">② 向外撬</text>
    </g>
    <text x="200" y="352" text-anchor="middle" fill="#1a8a3a">② 起子插入右側接縫，把背蓋右側向外撬</text>
    <text x="200" y="374" text-anchor="middle" fill="#333">扣環從倒勾上正確鬆脫 → 背蓋脫出</text>
  </g>

  <!-- 圖例 -->
  <g transform="translate(60,412)" font-size="13" fill="#555">
    <rect x="0" y="-10" width="18" height="10" fill="#333"/><text x="24" y="0">機身與內部支架</text>
    <rect x="130" y="-10" width="18" height="10" fill="#4a7bd0"/><text x="154" y="0">背蓋與 U 形扣環</text>
    <rect x="290" y="-10" width="18" height="10" fill="#d23"/><text x="314" y="0">支架上的反向倒勾</text>
    <path d="M450,-2 l8,-5 l-8,-5" fill="none" stroke="#888" stroke-width="2"/><text x="466" y="0">左側電池彈簧片（只輕微頂住）</text>
    <text x="0" y="28">剖面示意圖，非實際比例與形狀。上方為背蓋，下方為正面 LED。</text>
  </g>
</svg>
